services:
  web:
    build: .
    pull_policy: build
    environment:
      # A GitHub token for reading public repos' deployments. Without one, GitHub allows 60
      # requests an hour, which a few badges use up. Set it as the secret KITSHN_GITHUB_TOKEN.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ${KITSHN_SOCKET_DIR}:${KITSHN_SOCKET_DIR}
    # uvicorn creates the socket with mode 0666, so the host Caddy user can connect.
    command: ["uvicorn", "kitshn_meta.app:app", "--uds", "${KITSHN_DEFAULT_SOCKET}"]
    healthcheck:
      test: ["CMD", "test", "-S", "${KITSHN_DEFAULT_SOCKET}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
